name: Goyo iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Goyo/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: goyo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-ipa:
    name: Build ${{ matrix.scheme }} for iPhone
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [GoyoStandalone, Goyo, GoyoBrowser]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install test dependency
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/goyo-test-env"
          "$RUNNER_TEMP/goyo-test-env/bin/python3" -m pip install lxml
          printf '%s\n' "$RUNNER_TEMP/goyo-test-env/bin" >> "$GITHUB_PATH"

      - name: Check project and filters
        working-directory: Goyo
        run: |
          python3 Tools/check_project.py
          node Tests/filters.static.cjs
          node Tests/reading.test.cjs
          node Tests/dc.test.cjs
          node Tests/install-prompts.test.cjs
          python3 Tests/signing.test.py

      - name: Build device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project Goyo/Goyo.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/goyo-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package device IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 Goyo/Tools/package_ipa.py \
            "$RUNNER_TEMP/goyo-device/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app" \
            "$GITHUB_WORKSPACE/dist/${{ matrix.scheme }}-unsigned.ipa"
          printf '%s\n' 'Device build succeeded. Goyo includes the Screen Time extensions; it requires Family Controls and App Group provisioning for all four targets to run.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'GoyoStandalone is the complete UI build with Screen Time runtime/capabilities/extensions excluded. Screen Time settings only store preferences.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.scheme }}-IPA
          path: dist/${{ matrix.scheme }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  simulator-smoke:
    name: Launch standalone Goyo on iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile full simulator app
        run: |
          xcodebuild -project Goyo/Goyo.xcodeproj -scheme GoyoStandalone -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/goyo-simulator" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build
      - name: Verify launch and capture screens
        run: |
          python3 Goyo/Tools/simulator_smoke.py "$RUNNER_TEMP/goyo-simulator/Build/Products/Debug-iphonesimulator/GoyoStandalone.app" "$GITHUB_WORKSPACE/smoke-screens"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: GoyoStandalone-simulator-screens
          path: smoke-screens
          if-no-files-found: warn
          retention-days: 14
